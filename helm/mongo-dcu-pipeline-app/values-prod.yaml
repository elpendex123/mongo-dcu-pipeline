# prod: sizing and tuning only. Environment facts come from
# ansible/generated/values-prod.yaml once the prod stack exists (Phase 9).

config:
  LOG_LEVEL: INFO

# kube-prometheus-stack is installed before this chart in every AWS environment.
monitoring:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 384Mi
