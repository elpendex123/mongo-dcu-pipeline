# Defaults for the application chart. Three layers, later files winning:
#
#   values.yaml                           this file - safe defaults, nothing environment-specific
#   values-<env>.yaml                     per-environment sizing and tuning, committed
#   ansible/generated/values-<env>.yaml   per-session facts from Terraform: image, IAM role,
#                                         bucket names, region (gitignored, rebuilt every apply)
#
#   helm upgrade --install mongo-dcu-pipeline-app helm/mongo-dcu-pipeline-app \
#     --namespace qa -f helm/mongo-dcu-pipeline-app/values-qa.yaml -f ansible/generated/values-qa.yaml

image:
  # Both required. The generated values file supplies them.
  repository: ""
  # A commit tag. "latest" is refused at render time: a moving tag cannot be
  # rolled back to, because it no longer names what was running.
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  # Never created here. The service account is the Kubernetes half of the IRSA
  # binding whose IAM half Terraform wrote, and Ansible creates it. A chart
  # able to rename it could silently break the only identity the role trusts.
  create: false
  name: ""
  # Informational - the annotation lives on the service account itself.
  roleArn: ""

# Non-secret environment variables, rendered into a ConfigMap. The generated
# values add the environment-specific keys; these are the ones that are the
# same everywhere. APP_ENV, AWS_DEFAULT_REGION and S3_INPUT_BUCKET are required
# and checked at render time.
config:
  LOG_LEVEL: INFO
  MONGO_DATABASE: mongo_dcu
  MONGO_COLLECTION: properties
  LOG_DIR: /var/log/mongo-dcu
  WORK_DIR: /tmp/mongo-dcu

# Kubernetes Secrets mounted with envFrom, created by the Ansible secrets bridge.
secretRefs: []

metrics:
  port: 9090

# Prometheus integration: a ServiceMonitor for the metrics port, the
# application's alert rules, and its Grafana dashboard. Off by default, because
# the first two are kube-prometheus-stack's custom resources and a cluster
# without that release refuses them - install it first
# (ansible/playbooks/deploy-monitoring.yml), then turn this on.
monitoring:
  enabled: false
  scrapeInterval: 30s
  alerts:
    # Files, not lines: one bad line fails its whole file, and the file is what
    # someone has to fix. At this project's volume an hour holds a handful of
    # files, so a ratio alone would fire on a single failure - hence a minimum.
    failureRatio: 0.5
    minimumFiles: 2

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 384Mi

# The image runs as a named user (USER appuser). The kubelet cannot prove a name
# is not root, so the Pod Security Standard the namespace enforces refuses the
# pod unless the number is stated.
podSecurity:
  runAsUser: 1001
  runAsGroup: 1001

# Long enough to finish a file. On SIGTERM the application stops after the file
# in flight rather than abandoning it half-applied; this is how long Kubernetes
# waits before killing it anyway.
terminationGracePeriodSeconds: 120

# Scratch space. The root filesystem is read-only, so the log directory (which
# the Splunk sidecar will share in Phase 11) and the download directory are
# volumes.
volumes:
  logsSizeLimit: 256Mi
  tmpSizeLimit: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
