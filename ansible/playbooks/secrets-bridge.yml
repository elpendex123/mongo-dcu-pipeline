# Secrets Manager to Kubernetes Secrets.
#
# Secrets Manager is the source of truth; the pod mounts Kubernetes Secrets.
# This copies one into the other, reshaped into the environment variable names
# app/config.py reads, so the chart can mount each Secret with envFrom and no
# key mapping.
#
#   Secrets Manager                      Kubernetes Secret (namespace qa)
#   mongo-dcu-pipeline/qa/docdb       -> mongo-dcu-pipeline-docdb  MONGO_URI
#   mongo-dcu-pipeline/shared/rds     -> mongo-dcu-pipeline-rds    MYSQL_HOST, _PORT, _USER, _PASSWORD, _DATABASE
#   mongo-dcu-pipeline/qa/ses         -> mongo-dcu-pipeline-ses    SES_SENDER, SES_RECIPIENTS
#
# Rerun after any apply that changes a credential. Each Secret records the
# source version it was copied from, so a stale copy is visible.
#
#   ansible-playbook playbooks/secrets-bridge.yml -e target_env=qa

- name: Secrets bridge
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Load the environment context
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/load-context.yml"

    - name: Name the sources
      ansible.builtin.set_fact:
        secret_sources:
          - { key: docdb, source: "{{ tf_env.secret_names.docdb }}" }
          - { key: rds, source: "{{ tf_data.rds_secret_name }}" }
          - { key: ses, source: "{{ tf_env.secret_names.ses }}" }

    - name: Report the sources
      ansible.builtin.debug:
        msg: "reading {{ secret_sources | map(attribute='source') | join(', ') }}"

    # no_log throughout from here: a failed task would otherwise print its
    # arguments and results, credentials included, into the Jenkins console.
    - name: Read each source secret
      ansible.builtin.command:
        argv: [aws, secretsmanager, get-secret-value, --secret-id, "{{ item.source }}", --region, "{{ aws_region }}", --output, json]
      loop: "{{ secret_sources }}"
      register: source_secrets
      changed_when: false
      no_log: true

    - name: Hold the values in memory
      ansible.builtin.set_fact:
        sm: "{{ dict(source_secrets.results | map(attribute='item.key') | zip(source_secrets.results | map(attribute='stdout') | map('from_json'))) }}"
      no_log: true

    # Replaced rather than applied. A kubectl-style apply keeps a copy of the
    # whole object in a last-applied-configuration annotation - values
    # included, in plain text, readable by anyone allowed to read metadata.
    # The cost is that this task always reports changed.
    - name: Write the Kubernetes Secrets
      kubernetes.core.k8s:
        context: "{{ kube_context }}"
        state: present
        force: true
        definition:
          apiVersion: v1
          kind: Secret
          type: Opaque
          metadata:
            name: "{{ item.name }}"
            namespace: "{{ app_namespace }}"
            labels:
              app.kubernetes.io/part-of: "{{ project }}"
              app.kubernetes.io/managed-by: ansible
            annotations:
              mongo-dcu-pipeline/source: "{{ sm[item.key].Name }}"
              mongo-dcu-pipeline/source-version: "{{ sm[item.key].VersionId }}"
          stringData: "{{ item.data }}"
      loop:
        - key: docdb
          name: "{{ k8s_secret_docdb }}"
          data:
            MONGO_URI: "{{ (sm.docdb.SecretString | from_json).uri }}"
        - key: rds
          name: "{{ k8s_secret_rds }}"
          data:
            MYSQL_HOST: "{{ (sm.rds.SecretString | from_json).host }}"
            MYSQL_PORT: "{{ (sm.rds.SecretString | from_json).port | string }}"
            MYSQL_USER: "{{ (sm.rds.SecretString | from_json).username }}"
            MYSQL_PASSWORD: "{{ (sm.rds.SecretString | from_json).password }}"
            MYSQL_DATABASE: "{{ (sm.rds.SecretString | from_json).database }}"
        - key: ses
          name: "{{ k8s_secret_ses }}"
          data:
            SES_SENDER: "{{ (sm.ses.SecretString | from_json).sender }}"
            SES_RECIPIENTS: "{{ (sm.ses.SecretString | from_json).recipient }}"
      no_log: true

    - name: Read back what was written
      kubernetes.core.k8s_info:
        context: "{{ kube_context }}"
        kind: Secret
        namespace: "{{ app_namespace }}"
        label_selectors:
          - app.kubernetes.io/managed-by=ansible
      register: written
      no_log: true

    - name: Report key names, never values
      ansible.builtin.debug:
        msg: >-
          {{ item.metadata.name }}: {{ item.data | dict2items | map(attribute='key') | sort | join(', ') }}
          (from {{ item.metadata.annotations['mongo-dcu-pipeline/source'] }})
      loop: "{{ written.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"
