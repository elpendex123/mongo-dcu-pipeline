# The application's service account, bound to its IRSA role.
#
# Created here rather than by the Helm chart. The binding between a Kubernetes
# identity and an IAM role is infrastructure - Terraform wrote the role's trust
# policy naming this exact namespace and name - so it belongs with the rest of
# the environment's plumbing. A chart that could rename the service account
# could silently break the only identity the role will trust.
#
#   ansible-playbook playbooks/service-account.yml -e target_env=qa

- name: Application service account
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Load the environment context
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/load-context.yml"

    - name: Check the IRSA role exists
      ansible.builtin.assert:
        that: tf_env.irsa_role_arn | default('') | length > 0
        fail_msg: "the {{ target_env }} stack has no IRSA role - {{ tf_env.irsa_status | default('apply it first') }}"
        quiet: true

    - name: Create the service account
      kubernetes.core.k8s:
        context: "{{ kube_context }}"
        state: present
        definition:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: "{{ app_service_account }}"
            namespace: "{{ app_namespace }}"
            labels:
              app.kubernetes.io/part-of: "{{ project }}"
              app.kubernetes.io/managed-by: ansible
            annotations:
              eks.amazonaws.com/role-arn: "{{ tf_env.irsa_role_arn }}"
              # The global STS endpoint is on the internet, which this VPC
              # cannot reach. The regional one has a VPC endpoint. This makes
              # the webhook set AWS_STS_REGIONAL_ENDPOINTS=regional - which is
              # only half of it: botocore also needs AWS_DEFAULT_REGION in the
              # pod, or it has no region to be regional in (issue 17).
              eks.amazonaws.com/sts-regional-endpoints: "true"

    - name: Report the binding
      ansible.builtin.debug:
        msg: "{{ app_namespace }}/{{ app_service_account }} -> {{ tf_env.irsa_role_arn }}"
