# Read automatically when ansible-playbook runs from this directory:
#
#   cd ansible && ansible-playbook playbooks/configure-cluster.yml -e target_env=qa
#
# From anywhere else, name it:
#
#   ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook ansible/playbooks/configure-cluster.yml

[defaults]
inventory = inventory/localhost.yml
retry_files_enabled = False
interpreter_python = auto_silent
callback_result_format = yaml
nocows = True
